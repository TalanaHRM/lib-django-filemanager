name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  ai-review:
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'chore/') &&
      github.event.pull_request.draft == false
    uses: TalanaHRM/platform-ci-workflows/.github/workflows/ai-code-review-v2.yml@main
    with:
      stack: django
    secrets: inherit

  ai-chat:
    if: |
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request_review_comment'
    uses: TalanaHRM/platform-ci-workflows/.github/workflows/ai-code-review-comment-v2.yml@main
    secrets: inherit
