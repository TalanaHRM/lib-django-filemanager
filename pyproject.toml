# Dependency metadata for `uv lock`, so that scanners such as Aikido can resolve the full tree.
# Packaging is still defined in setup.py. Keep name, version and dependencies in sync with it.
[project]
name = "django-filemanager"
version = "0.0.4"
description = "A file manager for Django"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "django",
    "Pillow",
    "python-magic",
]

[tool.uv]
package = false
